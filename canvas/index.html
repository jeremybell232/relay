<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>relay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" />
    <link rel="stylesheet" href="/canvas.css" />
  </head>
  <body>
    <div id="viewport">
      <div id="world">
        <div id="cards"></div>
        <svg id="ink" width="1" height="1">
          <defs>
            <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
              <path d="M0 0 L10 5 L0 10 z" fill="context-stroke" />
            </marker>
          </defs>
          <g id="shapes"></g>
          <g id="hover"></g>
          <g id="handles"></g>
          <g id="draft"></g>
        </svg>
        <div id="notes"></div>
      </div>
    </div>

    <!-- Project, top left (where Figma shows the file name) -->
    <div class="project">
      <svg class="mark" viewBox="0 0 20 20" aria-hidden="true">
        <rect x="2.75" y="5.75" width="9.5" height="11.5" rx="2.25" fill="none" stroke="currentColor" stroke-width="1.5" />
        <rect x="7.5" y="2.5" width="10" height="12" rx="2.5" fill="#0d99ff" />
      </svg>
      <span id="project-name">relay</span>
    </div>

    <!-- Tools, bottom centre -->
    <nav class="toolbar" role="toolbar" aria-label="Tools">
      <button data-tool="select" aria-label="Move" data-tip="Move" data-key="V">
        <!-- Lucide: mouse-pointer-2 -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4.037 4.688a.495.495 0 0 1 .651-.651l16 6.5a.5.5 0 0 1-.063.947l-6.124 1.58a2 2 0 0 0-1.438 1.435l-1.579 6.126a.5.5 0 0 1-.947.063z" />
        </svg>
      </button>
      <button data-tool="note" aria-label="Annotate" data-tip="Annotate" data-key="Y">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M10.9922 19H20C20.5304 19 21.0391 18.7893 21.4142 18.4142C21.7893 18.0391 22 17.5304 22 17V5C22 4.46957 21.7893 3.96086 21.4142 3.58579C21.0391 3.21071 20.5304 3 20 3H4C3.46957 3 2.96086 3.21071 2.58579 3.58579C2.21071 3.96086 2 4.46957 2 5V13.9922" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M5 21.9961C6.65685 21.9961 8 20.6529 8 18.9961C8 17.3392 6.65685 15.9961 5 15.9961C3.34315 15.9961 2 17.3392 2 18.9961C2 20.6529 3.34315 21.9961 5 21.9961Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
      <span class="divider" aria-hidden="true"></span>
      <label class="swatch" data-tip="Background" data-key="Double-click to reset">
        <span></span><input id="bg" type="color" value="#f5f5f5" aria-label="Canvas background colour" />
      </label>
      <span class="divider" aria-hidden="true"></span>
      <span id="zoom" class="zoom" data-tip="Zoom" data-key="⌘ + scroll">100%</span>
    </nav>
    <div id="tip" class="tip" role="tooltip" hidden></div>

    <div id="menu" class="menu" role="menu" hidden>
      <button data-action="delete-annotation" role="menuitem">Delete <kbd>⌫</kbd></button>
    </div>

    <div id="empty" hidden>
      <p class="h">No snapshots yet</p>
      <p>Add this to the page you're working on, then press <kbd>⌥⇧S</kbd> or click <b>Snap</b>:</p>
      <code id="snippet"></code>
    </div>

    <div id="view-only" class="view-only" hidden>
      <strong>View only</strong> — relay isn't running for this project. To edit, run
      <code></code>
    </div>

    <script type="module" src="/canvas.js"></script>
  </body>
</html>
